# docker-compose.override.yml
# Automatically picked up by docker compose alongside docker-compose.yml.
# Mounts ./patches/ directory and runs patch scripts on container startup.
# This ensures code patches survive ALL container recreates without rebuilding images.
#
# HOW IT WORKS:
#   1. patches/*.patch.js files are mounted read-only into /patches/
#   2. Each service's entrypoint runs the patch script BEFORE starting the service
#   3. Patches are idempotent — safe to run on every start even if already applied
#
# ADDING A NEW PATCH:
#   1. Create patches/<service>.patch.js
#   2. Add the service override below
#   3. git push gad main && ssh into VPS && git pull && docker compose up -d <service>

services:
  base-scanner:
    volumes:
      - ./patches:/patches:ro
    command: ["/bin/sh", "/patches/base-scanner-start.sh"]

  autobuy:
    volumes:
      - ./patches:/patches:ro
    command: ["/bin/sh", "/patches/autobuy-start.sh"]

  polymarket-bot:
    entrypoint: ["node"]
    command: ["-r", "ts-node/register", "-r", "tsconfig-paths/register", "services/polymarket-bot/src/index.ts"]
    volumes:
      - ./services/polymarket-bot/src/scorer.ts:/usr/src/app/services/polymarket-bot/src/scorer.ts:ro
